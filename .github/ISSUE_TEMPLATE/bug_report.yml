name: Bug Report
description: Create a report to help reproduce and fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue in Office Terminal!
  - type: input
    id: version
    attributes:
      label: Office Terminal Version
      description: What version or git commit of Office Terminal are you running?
      placeholder: "e.g. 0.1.0 (commit abc1234)"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal Emulator & OS
      description: Which terminal emulator and operating system are you using?
      placeholder: "e.g. Kitty 0.35 on Linux, Ghostty 1.0 on macOS"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal sample presentation to reproduce the issue.
      placeholder: |
        1. Run `ot sample.pptx`
        2. Press `p` to open presenter view
        3. Observe error
    validations:
      required: true
