name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kitty-pptx
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kitty-pptx
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: kitty-pptx

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p kitty-pptx-cli

      - name: Package archive
        run: |
          ARCHIVE_DIR="kitty-pptx-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$ARCHIVE_DIR/"
          cp README.md LICENSE "$ARCHIVE_DIR/"
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kitty-pptx-*.tar.gz
            kitty-pptx-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
