name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p office-terminal-cli

      - name: Package archive
        run: |
          ARCHIVE_DIR="office-terminal-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/ot" "$ARCHIVE_DIR/"
          cp "target/${{ matrix.target }}/release/office-terminal" "$ARCHIVE_DIR/"
          cp README.md LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md "$ARCHIVE_DIR/"
          mkdir -p "$ARCHIVE_DIR/crates/office-terminal-core/assets/fonts"
          cp crates/VENDORED.md "$ARCHIVE_DIR/crates/"
          cp crates/office-terminal-core/assets/fonts/NOTICE.md \
             crates/office-terminal-core/assets/fonts/OFL.txt \
             "$ARCHIVE_DIR/crates/office-terminal-core/assets/fonts/"
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_DIR}.tar.gz" > "${ARCHIVE_DIR}.tar.gz.sha256"
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            office-terminal-*.tar.gz
            office-terminal-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
