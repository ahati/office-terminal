name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Rustfmt (first-party crates)
        run: >
          cargo fmt
          -p office-terminal-core
          -p office-terminal-display
          -p office-terminal-pdf
          -p office-terminal-docx
          -p office-terminal-tui
          -p office-terminal-cli
          -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Enforce < 600 lines per file
        run: |
          oversized=$(find crates/office-terminal-* -name "*.rs" -exec wc -l {} + | awk '$1 > 600 {print $2, "(" $1 " lines)"}')
          if [ -n "$oversized" ]; then
            echo "Error: The following source files exceed the 600-line limit:"
            echo "$oversized"
            exit 1
          fi

  msrv:
    name: MSRV (Rust 1.93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check workspace on the declared MSRV
        run: cargo check --workspace

  licenses:
    name: Licenses, sources & bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
          arguments: ""
          rust-version: "1.93.0"
