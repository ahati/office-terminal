[workspace]
resolver = "2"
members = [
    "crates/ooxml-common",
    "crates/pptx-model",
    "crates/pptx-parser",
    "crates/kitty-pptx-core",
    "crates/kitty-pptx-display",
    "crates/kitty-pptx-pdf",
    "crates/kitty-pptx-tui",
    "crates/kitty-pptx-cli",
]
# Locally patched metafile-rs crates (Apache-2.0). The rest of the family is
# consumed from crates.io; these two are overridden via [patch.crates-io]
# because they carry crop-clamping fixes (crates/patches/0003). Excluded from
# workspace lints/tests so upstream code is not held to first-party rules.
exclude = [
    "crates/metafile-core",
    "crates/metafile-dib",
    "crates/metafile-emf",
    "crates/metafile-emfplus",
    "crates/metafile-wmf",
    "fuzz",
]
default-members = ["crates/kitty-pptx-cli"]

[workspace.dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2"] }
metafile-core = "=1.0.1"
metafile-emf = "=1.0.1"
metafile-wmf = "=1.0.1"
roxmltree = "0.20"
quick-xml = "0.41"
base64 = "0.22"
sha2 = "0.10"
console_error_panic_hook = "0.1"

# In-tree crates
ooxml-common = { path = "crates/ooxml-common" }
pptx-model = { path = "crates/pptx-model" }
pptx-parser = { path = "crates/pptx-parser", default-features = false }
kitty-pptx-core = { path = "crates/kitty-pptx-core" }
kitty-pptx-display = { path = "crates/kitty-pptx-display" }
kitty-pptx-pdf = { path = "crates/kitty-pptx-pdf" }
kitty-pptx-tui = { path = "crates/kitty-pptx-tui" }

# PDF engine dependencies (PRD 14)
hayro = "=0.9.0"
hayro-syntax = "=0.9.0"
hayro-interpret = "=0.9.0"
hayro-svg = "=0.9.0"

# Shared utility & display dependencies
thiserror = "2"
crossbeam-channel = "0.5"
crossterm = "0.28"
signal-hook = "0.3"
ratatui = "0.29"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
toml = "0.8"
indicatif = "0.17"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
tiny-skia = "0.11"
cosmic-text = "0.12"
fontdb = "0.16"
swash = "0.1"
rustybuzz = "0.14"
resvg = "0.44"

[patch.crates-io]
# Only the crates carrying local fixes are kept in-tree (PRD 13 §2.2).
metafile-core = { path = "crates/metafile-core" }
metafile-dib = { path = "crates/metafile-dib" }
metafile-emf = { path = "crates/metafile-emf" }
metafile-emfplus = { path = "crates/metafile-emfplus" }
metafile-wmf = { path = "crates/metafile-wmf" }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

