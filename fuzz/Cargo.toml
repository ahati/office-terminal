[package]
name = "kitty-pptx-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
kitty-pptx-core = { path = "../crates/kitty-pptx-core" }

[[bin]]
name = "fuzz_metafile"
path = "fuzz_targets/fuzz_metafile.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
