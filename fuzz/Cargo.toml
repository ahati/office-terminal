[package]
name = "kitty-pptx-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
kitty-pptx-core = { path = "../crates/kitty-pptx-core" }

[patch.crates-io]
metafile-core = { path = "../crates/metafile-core" }
metafile-dib = { path = "../crates/metafile-dib" }
metafile-emf = { path = "../crates/metafile-emf" }
metafile-emfplus = { path = "../crates/metafile-emfplus" }
metafile-wmf = { path = "../crates/metafile-wmf" }

[[bin]]
name = "fuzz_metafile"
path = "fuzz_targets/fuzz_metafile.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
