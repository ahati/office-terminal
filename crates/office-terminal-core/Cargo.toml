[package]
name = "office-terminal-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["metafile"]
# Links the EMF/WMF/EMF+ playback engine. With the feature off, metafile
# pictures route straight to the §3 placeholder (no engine code is built).
metafile = ["dep:metafile-core", "dep:metafile-emf", "dep:metafile-wmf"]

[dependencies]
ooxml-common = { workspace = true }
pptx-model = { workspace = true }
pptx-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }
tempfile = { workspace = true }
tiny-skia = { workspace = true }
cosmic-text = { workspace = true }
fontdb = { workspace = true }
swash = { workspace = true }
rustybuzz = { workspace = true }
resvg = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
metafile-core = { workspace = true, optional = true }
metafile-emf = { workspace = true, optional = true }
metafile-wmf = { workspace = true, optional = true }

[dev-dependencies]
sha2 = { workspace = true }
